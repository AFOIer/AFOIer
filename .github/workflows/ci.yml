name: Deploy to gh-pages branch

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 需要写入权限来推送分支
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - run: |
          pip install mkdocs==1.6.1
          pip install mkdocs-awesome-pages-plugin==2.10.1
          pip install mkdocs-get-deps==0.2.2
          pip install mkdocs-git-authors-plugin==0.10.0
          pip install mkdocs-git-committers-plugin-2==2.5.0
          pip install mkdocs-git-revision-date-localized-plugin==1.5.1
          pip install mkdocs-material==9.7.6
          pip install mkdocs-material-extensions==1.3.1
      
      - name: Build and Deploy to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # mkdocs gh-deploy 会自动处理 gh-pages 分支的创建/更新
          mkdocs gh-deploy --force --clean